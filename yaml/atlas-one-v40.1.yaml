# SECTION: 03_lte_service.yaml
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
---
# ============================================================
# Atlas One v40.1 — LTE Service
# Namespace: atlas-lte
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-lte-svc
  namespace: atlas-lte
  labels:
    app: atlas-lte-svc
    version: v40.1
    tier: core
    component: lte
  annotations:
    atlas.io/service: "lte"
    atlas.io/owner: "radio-access-team"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-lte-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-lte-svc
        version: v40.1
        tier: core
    spec:
      serviceAccountName: atlas-lte-sa
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - atlas-lte-svc
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: atlas.io/node-role
                    operator: In
                    values:
                      - lte-core
                      - general
      initContainers:
        - name: lte-config-init
          image: registry.atlas.io/atlas-lte-init:v40.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "cp /config-src/* /etc/atlas/lte/ && /scripts/validate-lte-config.sh"]
          volumeMounts:
            - name: lte-config-vol
              mountPath: /config-src
              readOnly: true
            - name: lte-runtime-config
              mountPath: /etc/atlas/lte
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: lte-svc
          image: registry.atlas.io/atlas-lte-svc:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50053
              protocol: TCP
            - name: http
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: s1ap
              containerPort: 36412
              protocol: SCTP
            - name: gtpu
              containerPort: 2152
              protocol: UDP
          env:
            - name: SERVICE_NAME
              value: "atlas-lte-svc"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: GRPC_PORT
              value: "50053"
            - name: HTTP_PORT
              value: "8082"
            - name: METRICS_PORT
              value: "9090"
            - name: LTE_BAND
              value: "B2,B4,B12,B17,B66"
            - name: CARRIER_AGGREGATION_ENABLED
              value: "true"
            - name: MAX_COMPONENT_CARRIERS
              value: "5"
            - name: MIMO_MODE
              value: "4x4"
            - name: QCI_PROFILES_ENABLED
              value: "1,2,3,4,5,6,7,8,9"
            - name: DEFAULT_QCI
              value: "9"
            - name: VOLTE_QCI
              value: "1"
            - name: EPC_MME_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: EPC_MME_HOST
            - name: EPC_MME_PORT
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: EPC_MME_PORT
            - name: EPC_SGW_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: EPC_SGW_HOST
            - name: EPC_PGW_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: EPC_PGW_HOST
            - name: HSS_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: HSS_HOST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: KAFKA_BROKERS
            - name: MCC
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: MCC
            - name: MNC
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: MNC
            - name: TAC
              valueFrom:
                configMapKeyRef:
                  name: atlas-lte-config
                  key: TAC
            - name: LTE_SECURITY_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-lte-secrets
                  key: LTE_SECURITY_KEY
            - name: MME_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-lte-secrets
                  key: MME_SHARED_KEY
            - name: HSS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-lte-secrets
                  key: HSS_DB_PASSWORD
            - name: GTP_TUNNEL_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-lte-secrets
                  key: GTP_TUNNEL_KEY
          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "8000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8082
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: lte-runtime-config
              mountPath: /etc/atlas/lte
            - name: lte-scratch
              mountPath: /tmp/lte
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - SYS_RAWIO
        - name: lte-metrics-exporter
          image: registry.atlas.io/atlas-lte-exporter:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: exporter
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-lte-tls
        - name: lte-config-vol
          configMap:
            name: atlas-lte-config
        - name: lte-runtime-config
          emptyDir: {}
        - name: lte-scratch
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-lte-svc
  namespace: atlas-lte
  labels:
    app: atlas-lte-svc
    version: v40.1
spec:
  type: ClusterIP
  selector:
    app: atlas-lte-svc
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
      protocol: TCP
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP

