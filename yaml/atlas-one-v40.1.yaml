---
# ============================================================
# Network Policies — Zero-Trust Inter-Namespace Communication
# ============================================================

# ---- Default deny-all for all Atlas namespaces ----------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-default-deny-all
  namespace: atlas-identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-default-deny-all
  namespace: atlas-telco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-default-deny-all
  namespace: atlas-lte
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-default-deny-all
  namespace: atlas-routing
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-default-deny-all
  namespace: atlas-provenance
spec:
  podSelector: {}
  policyTypes:
    - Ingress
