            - name: GCP_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-adapters-secrets
                  key: GCP_SERVICE_ACCOUNT_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          livenessProbe:
