  namespace: atlas-elb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: atlas-elb-controller

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-elb-channel-manager-pdb
  namespace: atlas-elb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: atlas-elb-channel-manager

