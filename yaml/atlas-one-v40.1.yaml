# ============================================================
# Atlas One v40.1 — Food Defense Safety Stack
# Namespace: atlas-food-defense
# Components: Threat Detection, HACCP Engine, Trace & Recall,
#             Contamination Monitor, Regulatory Reporter
# ============================================================

# ---- Threat Detection -----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-fd-threat-detection
  namespace: atlas-food-defense
  labels:
    app: atlas-fd-threat-detection
    version: v40.1
    tier: safety
    component: food-defense
    subsystem: threat-detection
  annotations:
    atlas.io/service: "food-defense-threat-detection"
    atlas.io/owner: "food-safety-team"
    atlas.io/compliance: "FSMA,HACCP,FDA21CFR11,ISO22000"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-fd-threat-detection
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-fd-threat-detection
        version: v40.1
        tier: safety
    spec:
      serviceAccountName: atlas-food-defense-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: threat-detection
          image: registry.atlas.io/atlas-fd-threat-detection:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50060
              protocol: TCP
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-fd-threat-detection"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: THREAT_MODEL_VERSION
              value: "atlas-td-model-v12.3"
            - name: ML_INFERENCE_BACKEND
              value: "triton"
            - name: TRITON_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: TRITON_ENDPOINT
            - name: DETECTION_SENSITIVITY
              value: "HIGH"
            - name: ANOMALY_THRESHOLD
              value: "0.85"
            - name: SENSOR_POLLING_INTERVAL_MS
              value: "500"
            - name: IOT_BROKER_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: IOT_BROKER_HOST
            - name: IOT_BROKER_PORT
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: IOT_BROKER_PORT
            - name: IOT_TOPICS
              value: "sensors/temperature,sensors/ph,sensors/humidity,sensors/pressure,sensors/contaminants,sensors/pathogens"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: KAFKA_BROKERS
            - name: KAFKA_THREAT_TOPIC
              value: "atlas.fooddefense.threats"
            - name: KAFKA_ALERTS_TOPIC
              value: "atlas.fooddefense.alerts"
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: ALERT_WEBHOOK_URL
            - name: ALERT_ESCALATION_ENABLED
              value: "true"
            - name: ALERT_ESCALATION_THRESHOLD_CRITICAL
              value: "0.95"
            - name: REGULATORY_NOTIFICATION_ENABLED
              value: "true"
            - name: FDA_RAPID_ALERT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: FDA_RAPID_ALERT_ENDPOINT
            - name: MODEL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-food-defense-secrets
                  key: MODEL_SIGNING_KEY
            - name: IOT_BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-food-defense-secrets
                  key: IOT_BROKER_PASSWORD
            - name: FDA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-food-defense-secrets
                  key: FDA_API_KEY
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: food-defense-config-vol
              mountPath: /etc/atlas/food-defense
              readOnly: true
            - name: model-store
              mountPath: /models
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-food-defense-tls
        - name: food-defense-config-vol
          configMap:
            name: atlas-food-defense-config
        - name: model-store
          persistentVolumeClaim:
            claimName: atlas-fd-model-store-pvc
      imagePullSecrets:
        - name: atlas-registry-creds

