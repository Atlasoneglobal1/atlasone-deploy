  selector:
    matchLabels:
      app: atlas-adapter-erp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-adapter-erp
        version: v40.1
