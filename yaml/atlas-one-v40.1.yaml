# ---- Vault (optional secondary secrets backend) ---------------------
# Only activated if ATLAS_VAULT_ENABLED=true in cluster config
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-vault-agent-config
  namespace: atlas-secrets
  labels:
    atlas.io/baseline: v40.1
    atlas.io/optional: "true"
data:
  vault-agent.hcl: |
    vault {
      address = "https://vault.atlas.io:8200"
      tls_skip_verify = false
      tls_ca_cert = "/etc/vault/tls/ca.crt"
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config {
          role = "atlas-v40-1"
        }
      }
      sink "file" {
        config {
          path = "/home/vault/.vault-token"
        }
      }
    }
    template_config {
      static_secret_render_interval = "5m"
      exit_on_retry_failure = true
    }

