spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# ---- Identity Service — Allow from Gateway & ELB -------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-identity-ingress
  namespace: atlas-identity
spec:
  podSelector:
    matchLabels:
      app: atlas-identity-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-gateway
      ports:
        - port: 8080
          protocol: TCP
        - port: 50051
          protocol: TCP
    # From ELB
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-elb
      ports:
        - port: 50051
          protocol: TCP
    # From all Atlas namespaces (JWT verification)
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: atlas.io/baseline
                operator: Exists
      ports:
        - port: 50051
          protocol: TCP
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres-identity
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis-master
      ports:
        - port: 6379
          protocol: TCP
    # Kafka
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # LDAP
    - ports:
        - port: 636
          protocol: TCP

---
# ---- Telco Service — Allow from Gateway, ELB ----------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-telco-ingress
  namespace: atlas-telco
spec:
  podSelector:
    matchLabels:
      app: atlas-telco-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-elb
      ports:
        - port: 8081
          protocol: TCP
        - port: 50052
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Identity (JWT)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-identity
      ports:
        - port: 50051
          protocol: TCP
    # Provenance (CDRs)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-provenance
      ports:
        - port: 50055
          protocol: TCP
    # Kafka
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # External carrier gateways (SIP)
    - ports:
        - port: 5060
          protocol: UDP
        - port: 5061
          protocol: TCP

---
# ---- LTE Service — Allow from Gateway, ELB, Telco -----------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-lte-ingress
  namespace: atlas-lte
spec:
  podSelector:
    matchLabels:
      app: atlas-lte-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-elb
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-telco
      ports:
        - port: 8082
          protocol: TCP
        - port: 50053
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-identity
      ports:
        - port: 50051
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # GTP-U (to radio units)
    - ports:
        - port: 2152
          protocol: UDP
    # S1AP to EPC
    - ports:
        - port: 36412
          protocol: SCTP

---
# ---- Routing Service -----------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-routing-ingress
  namespace: atlas-routing
spec:
  podSelector:
    matchLabels:
      app: atlas-routing-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: atlas.io/baseline
                operator: Exists
      ports:
        - port: 8083
          protocol: TCP
        - port: 50054
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # BGP peers
    - ports:
        - port: 179
          protocol: TCP

---
# ---- Provenance Service — Allow from all Atlas namespaces ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-provenance-ingress
  namespace: atlas-provenance
spec:
  podSelector:
    matchLabels:
      app: atlas-provenance-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: atlas.io/baseline
                operator: Exists
      ports:
        - port: 8084
          protocol: TCP
        - port: 50055
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # Hyperledger Fabric peer
    - to:
        - podSelector:
            matchLabels:
              app: fabric-peer0
      ports:
        - port: 7051
          protocol: TCP
    # S3 (AWS)
    - ports:
        - port: 443
          protocol: TCP

---
# ---- Food Defense — Strict: only from gateway, observability -------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-food-defense-ingress
  namespace: atlas-food-defense
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-elb
      ports:
        - port: 8090
          protocol: TCP
        - port: 8091
          protocol: TCP
        - port: 8092
          protocol: TCP
        - port: 8093
          protocol: TCP
        - port: 8094
          protocol: TCP
        - port: 50060
          protocol: TCP
        - port: 50061
          protocol: TCP
        - port: 50062
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
    # IoT sensors (trusted network segment)
    - from:
        - ipBlock:
            cidr: 10.200.0.0/16
      ports:
        - port: 8883
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-provenance
      ports:
        - port: 8084
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # FDA/USDA external APIs (HTTPS)
    - ports:
        - port: 443
          protocol: TCP

---
# ---- ELB — Allow intra-ELB + ingress from gateway -----------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-elb-ingress
  namespace: atlas-elb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-gateway
      ports:
        - port: 50070
          protocol: TCP
        - port: 50071
          protocol: TCP
        - port: 8100
          protocol: TCP
        - port: 8101
          protocol: TCP
        - port: 8102
          protocol: TCP
        - port: 8103
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
    # Intra-ELB
    - from:
        - podSelector: {}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow ELB to reach all upstream services
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: atlas.io/baseline
                operator: Exists
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP

---
# ---- Gateway — Egress to all Atlas namespaces ----------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-gateway-egress
  namespace: atlas-gateway
spec:
  podSelector:
    matchLabels:
      app: atlas-gateway-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public ingress from Istio
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 8200
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 50080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: atlas.io/baseline
                operator: Exists
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-observability
      ports:
        - port: 9092
          protocol: TCP
    # WAF / external threat intel
    - ports:
        - port: 443
          protocol: TCP

