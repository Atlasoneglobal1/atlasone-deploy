# ---- OpenTelemetry Collector ----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-otel-collector
  namespace: atlas-observability
  labels:
    app: atlas-otel-collector
    version: v40.1
    tier: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-otel-collector
  template:
    metadata:
      labels:
        app: atlas-otel-collector
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: otel-collector
          image: registry.atlas.io/otelcol-contrib:0.110.0-atlas
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/otel-collector/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: zpages
              containerPort: 55679
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: otel-config
          configMap:
            name: atlas-otel-config
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-otel-config
  namespace: atlas-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector
              static_configs:
                - targets: [localhost:8888]

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: cluster
            value: atlas-prod-cluster-01
            action: upsert
          - key: environment
            value: production
            action: upsert
          - key: baseline
            value: v40.1
            action: upsert
      filter/drop_noise:
        error_mode: ignore
        traces:
          span:
            - 'name == "/healthz/ready" or name == "/healthz/live"'

    exporters:
      otlp/jaeger:
        endpoint: atlas-jaeger-collector.atlas-observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://atlas-prometheus.atlas-observability.svc.cluster.local:9090/api/v1/write
      loki:
        endpoint: http://atlas-loki.atlas-observability.svc.cluster.local:3100/loki/api/v1/push

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop_noise, resource, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [loki]

