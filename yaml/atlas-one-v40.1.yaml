---
# ============================================================
# Atlas One v40.1 — Observability: Logging, Monitoring, Tracing
# Namespace: atlas-observability
# Components: Prometheus, Grafana, Alertmanager, Loki,
#             Fluent Bit, Jaeger, OpenTelemetry Collector,
#             Kafka (event bus), Elasticsearch
# ============================================================

# ---- Prometheus Stack -----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-prometheus
  namespace: atlas-observability
  labels:
    app: atlas-prometheus
    version: v40.1
    tier: observability
    component: monitoring
  annotations:
    atlas.io/service: "prometheus"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-prometheus
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-prometheus
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-prometheus-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: registry.atlas.io/prometheus:v2.54.0-atlas
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--storage.tsdb.retention.size=100GB"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
            - "--log.level=info"
            - "--log.format=json"
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: prometheus-config
          configMap:
            name: atlas-prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: atlas-prometheus-data-pvc
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-prometheus-config
  namespace: atlas-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: atlas-prod-cluster-01
        environment: production
        baseline: v40.1

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - atlas-alertmanager.atlas-observability.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Kubernetes API server
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Atlas microservices — auto-discover all pods with scrape annotation
      - job_name: atlas-microservices
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - atlas-identity
                - atlas-telco
                - atlas-lte
                - atlas-routing
                - atlas-provenance
                - atlas-food-defense
                - atlas-elb
                - atlas-gateway
                - atlas-adapters
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_version]
            action: replace
            target_label: version

      # Node exporter
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kafka JMX metrics
      - job_name: kafka-jmx
        static_configs:
          - targets:
              - kafka-0.atlas-observability.svc.cluster.local:9308
              - kafka-1.atlas-observability.svc.cluster.local:9308
              - kafka-2.atlas-observability.svc.cluster.local:9308
        labels:
          service: kafka

  rules/atlas-alerts.yml: |
    groups:
      - name: atlas-microservices-alerts
        rules:
          - alert: AtlasServiceDown
            expr: up{job="atlas-microservices"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Atlas service {{ $labels.app }} is down"
              description: "{{ $labels.app }} in namespace {{ $labels.namespace }} has been down for more than 1 minute."

          - alert: AtlasHighCPU
            expr: rate(container_cpu_usage_seconds_total{namespace=~"atlas-.*"}[5m]) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.container }}"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }} CPU > 90% for 5m."

          - alert: AtlasHighMemory
            expr: container_memory_working_set_bytes{namespace=~"atlas-.*"} / container_spec_memory_limit_bytes > 0.90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.container }}"

          - alert: AtlasHighErrorRate
            expr: rate(http_requests_total{namespace=~"atlas-.*", status=~"5.."}[5m]) / rate(http_requests_total{namespace=~"atlas-.*"}[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Error rate > 5% on {{ $labels.app }}"

          - alert: AtlasPodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace=~"atlas-.*"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"

          - alert: AtlasFoodDefenseThreatDetected
            expr: increase(atlas_fd_threats_detected_total[5m]) > 0
            for: 0s
            labels:
              severity: critical
              team: food-safety
            annotations:
              summary: "Food defense threat detected"
              description: "Threat detected in food defense safety stack. Immediate response required."

          - alert: AtlasLTEAttachRate
            expr: rate(atlas_lte_attach_attempts_total[5m]) - rate(atlas_lte_attach_success_total[5m]) > 100
            for: 2m
            labels:
              severity: warning
              team: lte
            annotations:
              summary: "LTE attach failure rate elevated"

          - alert: AtlasELBCircuitBreakerOpen
            expr: atlas_elb_circuit_breaker_state == 1
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "ELB circuit breaker open on channel {{ $labels.channel }}"

          - alert: AtlasProvenanceLedgerLag
            expr: atlas_provenance_ledger_commit_lag_seconds > 30
            for: 5m
            labels:
              severity: warning
              team: provenance
            annotations:
              summary: "Provenance ledger commit lag > 30s"

---
# ---- Alertmanager ---------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-alertmanager
  namespace: atlas-observability
  labels:
    app: atlas-alertmanager
    version: v40.1
    tier: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-alertmanager
  template:
    metadata:
      labels:
        app: atlas-alertmanager
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: registry.atlas.io/alertmanager:v0.27.0-atlas
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.peer=atlas-alertmanager-1.atlas-observability.svc.cluster.local:9094"
            - "--log.level=info"
            - "--log.format=json"
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
            - name: cluster
              containerPort: 9094
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: alertmanager-data
              mountPath: /alertmanager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: alertmanager-config
          secret:
            secretName: atlas-alertmanager-config
        - name: alertmanager-data
          emptyDir: {}
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-alertmanager-config
  namespace: atlas-observability
  annotations:
    atlas.io/secret-manager: "aws-secrets-manager"
    atlas.io/secret-arn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:atlas/alertmanager/v40.1"
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.atlas.io:587'
      smtp_from: 'alerts@atlas.io'
      smtp_require_tls: true
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'namespace', 'app']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'atlas-default'
      routes:
        - match:
            severity: critical
          receiver: atlas-pagerduty-critical
          continue: true
        - match:
            team: food-safety
          receiver: atlas-food-safety-team
          continue: true
        - match:
            team: lte
          receiver: atlas-lte-team
        - match:
            team: provenance
          receiver: atlas-provenance-team

    receivers:
      - name: atlas-default
        slack_configs:
          - api_url: 'PLACEHOLDER_INJECT_AT_DEPLOY'
            channel: '#atlas-alerts'
            title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      - name: atlas-pagerduty-critical
        pagerduty_configs:
          - routing_key: 'PLACEHOLDER_INJECT_AT_DEPLOY'
            description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
      - name: atlas-food-safety-team
        email_configs:
          - to: 'food-safety@atlas.io'
            subject: 'CRITICAL: Food Safety Alert - {{ .GroupLabels.alertname }}'
        pagerduty_configs:
          - routing_key: 'PLACEHOLDER_INJECT_AT_DEPLOY'
      - name: atlas-lte-team
        slack_configs:
          - api_url: 'PLACEHOLDER_INJECT_AT_DEPLOY'
            channel: '#atlas-lte-ops'
      - name: atlas-provenance-team
        slack_configs:
          - api_url: 'PLACEHOLDER_INJECT_AT_DEPLOY'
            channel: '#atlas-provenance-ops'

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname', 'namespace']

---
# ---- Grafana --------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-grafana
  namespace: atlas-observability
  labels:
    app: atlas-grafana
    version: v40.1
    tier: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-grafana
  template:
    metadata:
      labels:
        app: atlas-grafana
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: registry.atlas.io/grafana:11.2.0-atlas
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-grafana-secrets
                  key: ADMIN_PASSWORD
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "Atlas Identity"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atlas-grafana-secrets
                  key: OAUTH_CLIENT_ID
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-grafana-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://identity.atlas.io/oauth2/authorize"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "https://identity.atlas.io/oauth2/token"
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.atlas.io"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "ngalert,correlations"
            - name: GF_LOG_LEVEL
              value: "info"
            - name: GF_LOG_MODE
              value: "console"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_DATABASE_TYPE
              value: "postgres"
            - name: GF_DATABASE_HOST
              value: "postgres-grafana.atlas-observability.svc.cluster.local:5432"
            - name: GF_DATABASE_NAME
              value: "grafana"
            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-grafana-secrets
                  key: DB_USER
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-grafana-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-datasources-config
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: grafana-dashboards-config
          configMap:
            name: atlas-grafana-dashboards-config
        - name: grafana-datasources-config
          configMap:
            name: atlas-grafana-datasources-config
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-grafana-datasources-config
  namespace: atlas-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://atlas-prometheus.atlas-observability.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
      - name: Loki
        type: loki
        url: http://atlas-loki.atlas-observability.svc.cluster.local:3100
        access: proxy
        jsonData:
          derivedFields:
            - datasourceUid: Jaeger
              matcherRegex: '"traceID":"(\w+)"'
              name: TraceID
              url: '$${__value.raw}'
      - name: Jaeger
        type: jaeger
        url: http://atlas-jaeger-query.atlas-observability.svc.cluster.local:16686
        access: proxy
        uid: Jaeger
      - name: Elasticsearch
        type: elasticsearch
        url: http://atlas-elasticsearch.atlas-observability.svc.cluster.local:9200
        access: proxy
        jsonData:
          index: "atlas-logs-*"
          timeField: "@timestamp"
          esVersion: "8.0.0"

---
# ---- Loki (Log Aggregation) -----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-loki
  namespace: atlas-observability
  labels:
    app: atlas-loki
    version: v40.1
    tier: observability
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atlas-loki
  template:
    metadata:
      labels:
        app: atlas-loki
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: registry.atlas.io/loki:3.1.0-atlas
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
              readOnly: true
            - name: loki-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: loki-config
          configMap:
            name: atlas-loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: atlas-loki-data-pvc
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-loki-config
  namespace: atlas-observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
      log_format: json
    common:
      path_prefix: /data
      storage:
        filesystem:
          chunks_directory: /data/chunks
          rules_directory: /data/rules
        s3:
          endpoint: s3.us-east-1.amazonaws.com
          region: us-east-1
          bucketnames: atlas-loki-logs-prod
          insecure: false
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    ruler:
      alertmanager_url: http://atlas-alertmanager.atlas-observability.svc.cluster.local:9093
    limits_config:
      retention_period: 90d
      ingestion_rate_mb: 100
      ingestion_burst_size_mb: 200
      max_streams_per_user: 100000
      max_label_names_per_series: 30
    compactor:
      working_directory: /data/retention
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

---
# ---- Fluent Bit (Log Collector DaemonSet) ---------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atlas-fluent-bit
  namespace: atlas-observability
  labels:
    app: atlas-fluent-bit
    version: v40.1
    tier: observability
spec:
  selector:
    matchLabels:
      app: atlas-fluent-bit
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: atlas-fluent-bit
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-fluent-bit-sa
      tolerations:
        - operator: Exists
      hostNetwork: false
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: fluent-bit
          image: registry.atlas.io/fluent-bit:3.1.7-atlas
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOKI_URL
              value: "http://atlas-loki.atlas-observability.svc.cluster.local:3100"
            - name: ELASTICSEARCH_URL
              value: "http://atlas-elasticsearch.atlas-observability.svc.cluster.local:9200"
            - name: KAFKA_BROKERS
              value: "kafka-0.atlas-observability.svc.cluster.local:9092"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: etcmachineid
              mountPath: /etc/machine-id
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
      volumes:
        - name: fluent-bit-config
          configMap:
            name: atlas-fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: etcmachineid
          hostPath:
            path: /etc/machine-id
            type: File
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-fluent-bit-config
  namespace: atlas-observability
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             1
        Daemon            off
        Log_Level         info
        Log_File          /var/log/fluentbit.log
        Parsers_File      parsers.conf
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     100MB
        Skip_Long_Lines   On

    [FILTER]
        Name              kubernetes
        Match             kube.*
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix   kube.var.log.containers.
        Merge_Log         On
        Merge_Log_Key     log_processed
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off
        Labels            On
        Annotations       Off

    [FILTER]
        Name              grep
        Match             kube.*
        Regex             kubernetes.namespace_name ^atlas-

    [FILTER]
        Name              record_modifier
        Match             kube.*
        Record            cluster atlas-prod-cluster-01
        Record            baseline v40.1
        Record            environment production

    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              atlas-loki.atlas-observability.svc.cluster.local
        Port              3100
        Labels            job=atlas-fluent-bit, namespace=$kubernetes.namespace_name, app=$kubernetes.labels.app
        Auto_Kubernetes_Labels On
        Line_Format       json

    [OUTPUT]
        Name              kafka
        Match             kube.atlas-food-defense.*
        Brokers           kafka-0.atlas-observability.svc.cluster.local:9092
        Topics            atlas.logs.food-defense
        Format            json

  parsers.conf: |
    [PARSER]
        Name              atlas-json
        Format            json
        Time_Key          timestamp
        Time_Format       %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep         On

