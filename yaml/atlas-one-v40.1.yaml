# ---- ELB Channel Manager --------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-elb-channel-manager
  namespace: atlas-elb
  labels:
    app: atlas-elb-channel-manager
    version: v40.1
    tier: infrastructure
    component: elb
    subsystem: channel-manager
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atlas-elb-channel-manager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-elb-channel-manager
        version: v40.1
        tier: infrastructure
    spec:
      serviceAccountName: atlas-elb-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: channel-manager
          image: registry.atlas.io/atlas-elb-channel-manager:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50071
              protocol: TCP
            - name: http
              containerPort: 8101
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-elb-channel-manager"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            # Channel definitions
            - name: CHANNEL_IDENTITY_UPSTREAM
              value: "atlas-identity-svc.atlas-identity.svc.cluster.local:50051"
            - name: CHANNEL_TELCO_UPSTREAM
              value: "atlas-telco-svc.atlas-telco.svc.cluster.local:50052"
            - name: CHANNEL_LTE_UPSTREAM
              value: "atlas-lte-svc.atlas-lte.svc.cluster.local:50053"
            - name: CHANNEL_ROUTING_UPSTREAM
              value: "atlas-routing-svc.atlas-routing.svc.cluster.local:50054"
            - name: CHANNEL_PROVENANCE_UPSTREAM
              value: "atlas-provenance-svc.atlas-provenance.svc.cluster.local:50055"
            - name: CHANNEL_FD_THREAT_UPSTREAM
              value: "atlas-fd-threat-detection.atlas-food-defense.svc.cluster.local:50060"
            - name: CHANNEL_FD_HACCP_UPSTREAM
              value: "atlas-fd-haccp-engine.atlas-food-defense.svc.cluster.local:50061"
            - name: CHANNEL_FD_TRACE_UPSTREAM
              value: "atlas-fd-trace-recall.atlas-food-defense.svc.cluster.local:50062"
            - name: CHANNEL_GATEWAY_UPSTREAM
              value: "atlas-gateway-svc.atlas-gateway.svc.cluster.local:50080"
            # Channel weights (for WRR)
            - name: CHANNEL_IDENTITY_WEIGHT
              value: "100"
            - name: CHANNEL_TELCO_WEIGHT
              value: "150"
            - name: CHANNEL_LTE_WEIGHT
              value: "150"
            - name: CHANNEL_ROUTING_WEIGHT
              value: "200"
            - name: CHANNEL_PROVENANCE_WEIGHT
              value: "80"
            - name: CHANNEL_FD_WEIGHT
              value: "120"
            # Channel capacity
            - name: CHANNEL_MAX_CONNECTIONS
              value: "10000"
            - name: CHANNEL_QUEUE_DEPTH
              value: "5000"
            - name: CHANNEL_KEEPALIVE_INTERVAL_SECONDS
              value: "30"
            - name: CHANNEL_RECONNECT_BACKOFF_MAX_MS
              value: "5000"
            - name: CHANNEL_CONNECTION_POOL_SIZE
              value: "50"
            # Channel priorities
            - name: CHANNEL_PRIORITY_FOOD_DEFENSE
              value: "CRITICAL"
            - name: CHANNEL_PRIORITY_IDENTITY
              value: "HIGH"
            - name: CHANNEL_PRIORITY_LTE
              value: "HIGH"
            - name: CHANNEL_PRIORITY_TELCO
              value: "HIGH"
            - name: CHANNEL_PRIORITY_ROUTING
              value: "MEDIUM"
            - name: CHANNEL_PRIORITY_PROVENANCE
              value: "MEDIUM"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-elb-config
                  key: REDIS_HOST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-elb-config
                  key: KAFKA_BROKERS
            - name: CHANNEL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-elb-secrets
                  key: CHANNEL_HMAC_SECRET
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8101
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8101
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: elb-config-vol
              mountPath: /etc/atlas/elb
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-elb-tls
        - name: elb-config-vol
          configMap:
            name: atlas-elb-config
      imagePullSecrets:
        - name: atlas-registry-creds

