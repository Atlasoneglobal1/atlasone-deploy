            httpGet:
              path: /healthz/ready
              port: 8306
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: adapters-config-vol
              mountPath: /etc/atlas/adapters
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-adapters-tls
        - name: adapters-config-vol
          configMap:
            name: atlas-adapters-config
      imagePullSecrets:
        - name: atlas-registry-creds

