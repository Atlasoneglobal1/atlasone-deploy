apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-elb-config
  namespace: atlas-elb
data:
  REDIS_HOST: "redis-master.atlas-elb.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_CLUSTER_ENABLED: "true"
  KAFKA_BROKERS: "kafka-0.atlas-observability.svc.cluster.local:9092"
  KAFKA_ELB_EVENTS_TOPIC: "atlas.elb.events"
  KAFKA_ELB_METRICS_TOPIC: "atlas.elb.metrics"
  ETCD_ENDPOINTS: "http://etcd-0.atlas-elb.svc.cluster.local:2379,http://etcd-1.atlas-elb.svc.cluster.local:2379,http://etcd-2.atlas-elb.svc.cluster.local:2379"
  # Channel topology
  CHANNEL_TOPOLOGY: |
    channels:
      - id: identity-primary
        upstream: atlas-identity-svc.atlas-identity.svc.cluster.local:50051
        protocol: grpc
        tls: true
        priority: HIGH
        lb_algorithm: ROUND_ROBIN
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 5000
        retry_count: 3
      - id: telco-primary
        upstream: atlas-telco-svc.atlas-telco.svc.cluster.local:50052
        protocol: grpc
        tls: true
        priority: HIGH
        lb_algorithm: WEIGHTED_ROUND_ROBIN
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 10000
        retry_count: 2
      - id: lte-primary
        upstream: atlas-lte-svc.atlas-lte.svc.cluster.local:50053
        protocol: grpc
        tls: true
        priority: HIGH
        lb_algorithm: IP_HASH
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 10000
        retry_count: 2
      - id: routing-primary
        upstream: atlas-routing-svc.atlas-routing.svc.cluster.local:50054
        protocol: grpc
        tls: true
        priority: MEDIUM
        lb_algorithm: LEAST_CONNECTIONS
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 3000
        retry_count: 3
      - id: provenance-primary
        upstream: atlas-provenance-svc.atlas-provenance.svc.cluster.local:50055
        protocol: grpc
        tls: true
        priority: MEDIUM
        lb_algorithm: ROUND_ROBIN
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 8000
        retry_count: 2
      - id: food-defense-primary
        upstream: atlas-fd-threat-detection.atlas-food-defense.svc.cluster.local:50060
        protocol: grpc
        tls: true
        priority: CRITICAL
        lb_algorithm: LEAST_CONNECTIONS
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 2000
        retry_count: 5
      - id: gateway-primary
        upstream: atlas-gateway-svc.atlas-gateway.svc.cluster.local:50080
        protocol: grpc
        tls: true
        priority: HIGH
        lb_algorithm: ROUND_ROBIN
        health_check_path: /grpc.health.v1.Health/Check
        timeout_ms: 5000
        retry_count: 3

---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-elb-secrets
  namespace: atlas-elb
  annotations:
    atlas.io/secret-manager: "aws-secrets-manager"
    atlas.io/secret-arn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:atlas/elb/v40.1"
type: Opaque
stringData:
  ELB_ADMIN_TOKEN: "PLACEHOLDER_INJECT_AT_DEPLOY"
  TLS_CERT_ROTATION_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  CHANNEL_HMAC_SECRET: "PLACEHOLDER_INJECT_AT_DEPLOY"
  SESSION_ENCRYPTION_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"

