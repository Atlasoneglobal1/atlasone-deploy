# ---- Cert-Manager: ClusterIssuer (Let's Encrypt + Internal CA) ------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: atlas-letsencrypt-prod
  labels:
    atlas.io/baseline: v40.1
spec:
  acme:
    email: platform-eng@atlas.io
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: atlas-letsencrypt-prod-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: PLACEHOLDER_HOSTED_ZONE_ID
            role: arn:aws:iam::123456789012:role/atlas-cert-manager-role

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: atlas-internal-ca
  labels:
    atlas.io/baseline: v40.1
spec:
  ca:
    secretName: atlas-internal-ca-tls

---
# ---- Certificates for each service ----------------------------------
