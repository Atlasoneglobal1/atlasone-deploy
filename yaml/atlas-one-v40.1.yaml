---
# ============================================================
# Atlas One v40.1 — Provenance Service
# Namespace: atlas-provenance
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-provenance-svc
  namespace: atlas-provenance
  labels:
    app: atlas-provenance-svc
    version: v40.1
    tier: core
    component: provenance
  annotations:
    atlas.io/service: "provenance"
    atlas.io/owner: "data-integrity-team"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-provenance-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-provenance-svc
        version: v40.1
        tier: core
    spec:
      serviceAccountName: atlas-provenance-sa
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - atlas-provenance-svc
              topologyKey: kubernetes.io/hostname
      containers:
        - name: provenance-svc
          image: registry.atlas.io/atlas-provenance-svc:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50055
              protocol: TCP
            - name: http
              containerPort: 8084
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-provenance-svc"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: GRPC_PORT
              value: "50055"
            - name: HTTP_PORT
              value: "8084"
            - name: METRICS_PORT
              value: "9090"
            # Ledger configuration
            - name: LEDGER_BACKEND
              value: "hyperledger-fabric"
            - name: LEDGER_CHANNEL
              value: "atlas-provenance-channel"
            - name: LEDGER_CHAINCODE
              value: "atlas-provenance-cc"
            - name: LEDGER_ORG
              value: "AtlasOrg1"
            - name: LEDGER_PEER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: atlas-provenance-config
                  key: LEDGER_PEER_ENDPOINT
            - name: LEDGER_ORDERER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: atlas-provenance-config
                  key: LEDGER_ORDERER_ENDPOINT
            # Cryptographic signing
            - name: SIGNING_ALGORITHM
              value: "ECDSA-P384"
            - name: HASH_ALGORITHM
              value: "SHA3-256"
            - name: SIGNATURE_VERIFICATION_STRICT
              value: "true"
            # Storage
            - name: ARTIFACT_STORE_BACKEND
              value: "s3"
            - name: ARTIFACT_STORE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: atlas-provenance-config
                  key: ARTIFACT_STORE_BUCKET
            - name: ARTIFACT_STORE_REGION
              value: "us-east-1"
            - name: MERKLE_TREE_DEPTH
              value: "32"
            - name: IMMUTABLE_AUDIT_ENABLED
              value: "true"
            # Compliance
            - name: FDA_21CFR11_MODE
              value: "true"
            - name: ESIG_REQUIRED
              value: "true"
            - name: ESIG_MEANING_REQUIRED
              value: "true"
            # Data connections
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-provenance-config
                  key: DB_HOST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-provenance-config
                  key: KAFKA_BROKERS
            # Secrets
            - name: LEDGER_ADMIN_CERT
              valueFrom:
                secretKeyRef:
                  name: atlas-provenance-secrets
                  key: LEDGER_ADMIN_CERT
            - name: LEDGER_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-provenance-secrets
                  key: LEDGER_ADMIN_KEY
            - name: SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-provenance-secrets
                  key: SIGNING_PRIVATE_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-provenance-secrets
                  key: DB_PASSWORD
            - name: ESIG_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-provenance-secrets
                  key: ESIG_HMAC_SECRET
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8084
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: provenance-config-vol
              mountPath: /etc/atlas/provenance
              readOnly: true
            - name: ledger-crypto
              mountPath: /etc/atlas/ledger-crypto
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-provenance-tls
        - name: provenance-config-vol
          configMap:
            name: atlas-provenance-config
        - name: ledger-crypto
          secret:
            secretName: atlas-provenance-ledger-crypto
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-provenance-svc
  namespace: atlas-provenance
  labels:
    app: atlas-provenance-svc
    version: v40.1
spec:
  type: ClusterIP
  selector:
    app: atlas-provenance-svc
  ports:
    - name: grpc
      port: 50055
      targetPort: 50055
      protocol: TCP
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-provenance-config
  namespace: atlas-provenance
data:
  LEDGER_PEER_ENDPOINT: "fabric-peer0.atlas-provenance.svc.cluster.local:7051"
  LEDGER_ORDERER_ENDPOINT: "fabric-orderer0.atlas-provenance.svc.cluster.local:7050"
  DB_HOST: "postgres-provenance.atlas-provenance.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "atlas_provenance"
  ARTIFACT_STORE_BUCKET: "atlas-provenance-artifacts-prod"
  KAFKA_BROKERS: "kafka-0.atlas-observability.svc.cluster.local:9092"
  KAFKA_PROVENANCE_TOPIC: "atlas.provenance.events"
  KAFKA_AUDIT_TOPIC: "atlas.provenance.audit"
  CACHE_TTL_SECONDS: "300"
  BATCH_COMMIT_SIZE: "100"
  BATCH_COMMIT_INTERVAL_MS: "500"
  RETENTION_POLICY: "indefinite"
  DATA_CLASSIFICATION: "restricted"
  ESIG_PROVIDER: "atlas-esig-svc"
  ESIG_ENDPOINT: "http://atlas-esig-svc.atlas-provenance.svc.cluster.local:8085"

---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-provenance-secrets
  namespace: atlas-provenance
  annotations:
    atlas.io/secret-manager: "aws-secrets-manager"
    atlas.io/secret-arn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:atlas/provenance/v40.1"
type: Opaque
stringData:
  LEDGER_ADMIN_CERT: "PLACEHOLDER_INJECT_AT_DEPLOY"
  LEDGER_ADMIN_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  SIGNING_PRIVATE_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  DB_PASSWORD: "PLACEHOLDER_INJECT_AT_DEPLOY"
  ESIG_HMAC_SECRET: "PLACEHOLDER_INJECT_AT_DEPLOY"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-provenance-hpa
  namespace: atlas-provenance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-provenance-svc
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-provenance-pdb
  namespace: atlas-provenance
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: atlas-provenance-svc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-provenance-sa
  namespace: atlas-provenance
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/atlas-provenance-svc-role"


