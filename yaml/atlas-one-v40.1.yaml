---
# ============================================================
# Atlas One v40.1 — Telco Service
# Namespace: atlas-telco
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-telco-svc
  namespace: atlas-telco
  labels:
    app: atlas-telco-svc
    version: v40.1
    tier: core
    component: telco
  annotations:
    atlas.io/service: "telco"
    atlas.io/owner: "telco-platform-team"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-telco-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-telco-svc
        version: v40.1
        tier: core
    spec:
      serviceAccountName: atlas-telco-sa
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - atlas-telco-svc
              topologyKey: kubernetes.io/hostname
      containers:
        - name: telco-svc
          image: registry.atlas.io/atlas-telco-svc:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: sip
              containerPort: 5060
              protocol: UDP
            - name: rtp-low
              containerPort: 16384
              protocol: UDP
            - name: rtp-high
              containerPort: 32767
              protocol: UDP
          env:
            - name: SERVICE_NAME
              value: "atlas-telco-svc"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: GRPC_PORT
              value: "50052"
            - name: HTTP_PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9090"
            - name: SIP_PORT
              value: "5060"
            - name: RTP_PORT_MIN
              value: "16384"
            - name: RTP_PORT_MAX
              value: "32767"
            - name: SIGNALING_PROTOCOL
              value: "SIP/2.0"
            - name: CODEC_PRIORITY
              value: "opus,g722,g711u,g711a"
            - name: DTMF_MODE
              value: "rfc2833"
            - name: SRTP_ENABLED
              value: "true"
            - name: SRTP_CIPHER_SUITE
              value: "AES_256_CM_HMAC_SHA1_80"
            - name: CARRIER_GATEWAY
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: CARRIER_GATEWAY
            - name: PSTN_TRUNK_COUNT
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: PSTN_TRUNK_COUNT
            - name: SS7_GATEWAY_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: SS7_GATEWAY_HOST
            - name: SMSC_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: SMSC_HOST
            - name: SMSC_PORT
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: SMSC_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: DB_HOST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-telco-config
                  key: KAFKA_BROKERS
            - name: CARRIER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-telco-secrets
                  key: CARRIER_API_KEY
            - name: SMSC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-telco-secrets
                  key: SMSC_PASSWORD
            - name: SS7_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-telco-secrets
                  key: SS7_SHARED_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-telco-secrets
                  key: DB_PASSWORD
            - name: MEDIA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-telco-secrets
                  key: MEDIA_ENCRYPTION_KEY
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: telco-config-vol
              mountPath: /etc/atlas/telco
              readOnly: true
            - name: rtp-scratch
              mountPath: /tmp/rtp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-telco-tls
        - name: telco-config-vol
          configMap:
            name: atlas-telco-config
        - name: rtp-scratch
          emptyDir:
            medium: Memory
            sizeLimit: "512Mi"
      imagePullSecrets:
        - name: atlas-registry-creds

