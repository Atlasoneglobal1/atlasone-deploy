# ============================================================
# Atlas One v40.1 — Identity Service
# Namespace: atlas-identity
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-identity-svc
  namespace: atlas-identity
  labels:
    app: atlas-identity-svc
    version: v40.1
    tier: core
    component: identity
  annotations:
    atlas.io/service: "identity"
    atlas.io/owner: "iam-team"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-identity-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-identity-svc
        version: v40.1
        tier: core
    spec:
      serviceAccountName: atlas-identity-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - atlas-identity-svc
              topologyKey: kubernetes.io/hostname
      containers:
        - name: identity-svc
          image: registry.atlas.io/atlas-identity-svc:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-identity-svc"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: GRPC_PORT
              value: "50051"
            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: TOKEN_ISSUER
              value: "https://identity.atlas.io"
            - name: TOKEN_AUDIENCE
              value: "atlas-platform"
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: REFRESH_TOKEN_EXPIRY_SECONDS
              value: "86400"
            - name: MFA_ENABLED
              value: "true"
            - name: MFA_TOTP_ISSUER
              value: "AtlasOne"
            - name: SESSION_STORE
              value: "redis"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-identity-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: atlas-identity-config
                  key: REDIS_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-identity-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: atlas-identity-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: atlas-identity-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: DB_PASSWORD
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: JWT_PUBLIC_KEY
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: OAUTH2_CLIENT_ID
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: OAUTH2_CLIENT_SECRET
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: LDAP_BIND_PASSWORD
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-identity-secrets
                  key: ENCRYPTION_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: identity-config-vol
              mountPath: /etc/atlas/identity
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-identity-tls
        - name: identity-config-vol
          configMap:
            name: atlas-identity-config
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-identity-svc
  namespace: atlas-identity
  labels:
    app: atlas-identity-svc
    version: v40.1
spec:
  type: ClusterIP
  selector:
    app: atlas-identity-svc
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-identity-config
  namespace: atlas-identity
data:
  REDIS_HOST: "redis-master.atlas-identity.svc.cluster.local"
  REDIS_PORT: "6379"
  DB_HOST: "postgres-identity.atlas-identity.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "atlas_identity"
  LDAP_HOST: "ldap.atlas.io"
  LDAP_PORT: "636"
  LDAP_BASE_DN: "dc=atlas,dc=io"
  LDAP_BIND_DN: "cn=svc-atlas,ou=service-accounts,dc=atlas,dc=io"
  OIDC_DISCOVERY_URL: "https://identity.atlas.io/.well-known/openid-configuration"
  CORS_ALLOWED_ORIGINS: "https://console.atlas.io,https://api.atlas.io"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_DESTINATION: "kafka"
  KAFKA_BROKERS: "kafka-0.atlas-observability.svc.cluster.local:9092"
  KAFKA_AUDIT_TOPIC: "atlas.identity.audit"

---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-identity-secrets
  namespace: atlas-identity
  annotations:
    atlas.io/secret-manager: "aws-secrets-manager"
    atlas.io/secret-arn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:atlas/identity/v40.1"
type: Opaque
# Values injected at deploy-time via External Secrets Operator
# Plaintext placeholders only — never store real values here
stringData:
  DB_USER: "PLACEHOLDER_INJECT_AT_DEPLOY"
  DB_PASSWORD: "PLACEHOLDER_INJECT_AT_DEPLOY"
  JWT_PRIVATE_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  JWT_PUBLIC_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  OAUTH2_CLIENT_ID: "PLACEHOLDER_INJECT_AT_DEPLOY"
  OAUTH2_CLIENT_SECRET: "PLACEHOLDER_INJECT_AT_DEPLOY"
  LDAP_BIND_PASSWORD: "PLACEHOLDER_INJECT_AT_DEPLOY"
  ENCRYPTION_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-identity-hpa
  namespace: atlas-identity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-identity-svc
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-identity-pdb
  namespace: atlas-identity
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: atlas-identity-svc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-identity-sa
  namespace: atlas-identity
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/atlas-identity-svc-role"


