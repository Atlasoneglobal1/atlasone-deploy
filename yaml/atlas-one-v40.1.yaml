  KAFKA_ROUTE_EVENTS_TOPIC: "atlas.routing.events"
  KAFKA_TOPOLOGY_TOPIC: "atlas.routing.topology"
  REDIS_HOST: "redis-master.atlas-routing.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_ROUTE_CACHE_TTL: "300"
  ETCD_ENDPOINTS: "http://etcd-0.atlas-routing.svc.cluster.local:2379,http://etcd-1.atlas-routing.svc.cluster.local:2379,http://etcd-2.atlas-routing.svc.cluster.local:2379"
  TOPOLOGY_UPDATE_INTERVAL_MS: "500"
