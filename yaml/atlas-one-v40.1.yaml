# ---- HACCP Engine ---------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-fd-haccp-engine
  namespace: atlas-food-defense
  labels:
    app: atlas-fd-haccp-engine
    version: v40.1
    tier: safety
    component: food-defense
    subsystem: haccp
  annotations:
    atlas.io/service: "food-defense-haccp"
    atlas.io/compliance: "HACCP,Codex-Alimentarius,21CFR123"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-fd-haccp-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-fd-haccp-engine
        version: v40.1
        tier: safety
    spec:
      serviceAccountName: atlas-food-defense-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haccp-engine
          image: registry.atlas.io/atlas-fd-haccp-engine:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50061
              protocol: TCP
            - name: http
              containerPort: 8091
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-fd-haccp-engine"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: HACCP_PLAN_VERSION
              value: "v8.2"
            - name: CCP_EVALUATION_MODE
              value: "realtime"
            - name: CCP_MONITORING_INTERVAL_MS
              value: "1000"
            - name: CRITICAL_LIMIT_BREACH_ACTION
              value: "isolate-and-alert"
            - name: CORRECTIVE_ACTION_AUTO
              value: "true"
            - name: VERIFICATION_SCHEDULE
              value: "0 */6 * * *"
            - name: RECORD_KEEPING_BACKEND
              value: "provenance"
            - name: PROVENANCE_ENDPOINT
              value: "http://atlas-provenance-svc.atlas-provenance.svc.cluster.local:8084"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: KAFKA_BROKERS
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-food-defense-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-food-defense-secrets
                  key: DB_PASSWORD
          resources:
            requests:
