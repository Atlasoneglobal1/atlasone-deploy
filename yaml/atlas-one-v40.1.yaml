apiVersion: atlas.io/v40.1
kind: DeploymentBaseline
metadata:
  name: atlas-one-unified
  version: "40.1"
  release_date: "2026-10-18"
  environment: production
  owner: platform-engineering
  contact: platform-eng@atlas.io
  labels:
    tier: core
    compliance: soc2-iso27001-fda21cfr11
    baseline: v40.1
  annotations:
    atlas.io/build: "v40.1.0-stable"
    atlas.io/changelog: "https://internal.atlas.io/changelog/v40.1"
    atlas.io/runway: "2027-Q2"

global:
  registry: registry.atlas.io
  image_pull_policy: IfNotPresent
  image_pull_secrets:
    - name: atlas-registry-creds
  default_resource_limits:
    cpu: "2000m"
    memory: "2Gi"
  default_resource_requests:
    cpu: "250m"
    memory: "256Mi"
  termination_grace_period_seconds: 60
  security_context:
    run_as_non_root: true
    run_as_user: 10001
    fs_group: 10001
    seccomp_profile:
      type: RuntimeDefault
  topology_spread_constraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  pod_disruption_budget:
    min_available: "50%"
  priority_class_name: atlas-high-priority

namespaces:
  - atlas-identity
  - atlas-telco
  - atlas-lte
  - atlas-routing
  - atlas-provenance
  - atlas-food-defense
  - atlas-elb
  - atlas-gateway
  - atlas-adapters
  - atlas-observability
  - atlas-secrets

cluster:
  provider: eks
  region: us-east-1
  cluster_name: atlas-prod-cluster-01
  kubernetes_version: "1.30"
  node_groups:
    - name: atlas-core-ng
      instance_type: m6i.2xlarge
      min_size: 6
      max_size: 30
      desired_size: 12
    - name: atlas-gpu-ng
      instance_type: g5.2xlarge
      min_size: 2
      max_size: 8
      desired_size: 2
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule


