apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-elb-sa
  namespace: atlas-elb
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/atlas-elb-svc-role"


