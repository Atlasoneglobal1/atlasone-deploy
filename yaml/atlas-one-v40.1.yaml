  namespace: atlas-identity
spec:
  secretName: atlas-identity-tls
  issuerRef:
    name: atlas-internal-ca
    kind: ClusterIssuer
  commonName: atlas-identity-svc.atlas-identity.svc.cluster.local
  dnsNames:
    - atlas-identity-svc.atlas-identity.svc.cluster.local
    - atlas-identity-svc.atlas-identity.svc
    - atlas-identity-svc
    - identity.atlas.io
  duration: 8760h
  renewBefore: 720h
  usages:
    - server auth
    - client auth

