---
# StorageClasses
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: atlas-ebs-gp3
  labels:
    atlas.io/baseline: v40.1
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "6000"
  throughput: "500"
  encrypted: "true"
  kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/atlas-ebs-cmk"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: atlas-efs-sc
  labels:
    atlas.io/baseline: v40.1
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0123456789abcdef0
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: /atlas-v40.1
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true

---
# PersistentVolumeClaims for core stateful workloads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-prometheus-data-pvc
  namespace: atlas-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: atlas-ebs-gp3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-loki-data-pvc
  namespace: atlas-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: atlas-ebs-gp3


