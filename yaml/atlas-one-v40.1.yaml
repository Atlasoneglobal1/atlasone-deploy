            - name: BLUE_GREEN_ENABLED
              value: "true"
            - name: SHADOW_TRAFFIC_ENABLED
              value: "false"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-elb-config
                  key: REDIS_HOST
