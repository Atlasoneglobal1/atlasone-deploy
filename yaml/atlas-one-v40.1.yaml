---
# ============================================================
# Istio AuthorizationPolicies — Fine-grained access control
# ============================================================

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: atlas-identity-authz
  namespace: atlas-identity
spec:
  selector:
    matchLabels:
      app: atlas-identity-svc
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/atlas-gateway/sa/atlas-gateway-sa"
              - "cluster.local/ns/atlas-elb/sa/atlas-elb-sa"
              - "cluster.local/ns/atlas-telco/sa/atlas-telco-sa"
              - "cluster.local/ns/atlas-lte/sa/atlas-lte-sa"
              - "cluster.local/ns/atlas-routing/sa/atlas-routing-sa"
              - "cluster.local/ns/atlas-provenance/sa/atlas-provenance-sa"
              - "cluster.local/ns/atlas-food-defense/sa/atlas-food-defense-sa"
              - "cluster.local/ns/atlas-adapters/sa/atlas-adapters-sa"
              - "cluster.local/ns/atlas-observability/sa/atlas-prometheus-sa"

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: atlas-food-defense-authz
  namespace: atlas-food-defense
spec:
  selector:
    matchLabels:
      tier: safety
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/atlas-gateway/sa/atlas-gateway-sa"
              - "cluster.local/ns/atlas-elb/sa/atlas-elb-sa"
              - "cluster.local/ns/atlas-observability/sa/atlas-prometheus-sa"
    - from:
        - source:
            namespaces:
              - "atlas-food-defense"

---
# ============================================================
# Istio DestinationRules — Traffic policies & circuit breaking
# ============================================================

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: atlas-identity-dr
  namespace: atlas-identity
spec:
  host: atlas-identity-svc.atlas-identity.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
        connectTimeout: 5s
      http:
        h2UpgradePolicy: UPGRADE
        http2MaxRequests: 10000
        maxRequestsPerConnection: 100
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
      minHealthPercent: 70
    tls:
      mode: ISTIO_MUTUAL
  subsets:
    - name: stable
      labels:
        version: v40.1

---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: atlas-food-defense-dr
  namespace: atlas-food-defense
spec:
  host: atlas-fd-threat-detection.atlas-food-defense.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 2000
        connectTimeout: 2s
      http:
        h2UpgradePolicy: UPGRADE
        http2MaxRequests: 20000
        maxRetries: 5
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 15s
      maxEjectionPercent: 20
      minHealthPercent: 80
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: atlas-telco-dr
  namespace: atlas-telco
spec:
  host: atlas-telco-svc.atlas-telco.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 3000
        connectTimeout: 10s
      http:
        h2UpgradePolicy: UPGRADE
        http2MaxRequests: 30000
        maxRetries: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 25
    tls:
      mode: ISTIO_MUTUAL

---
# ============================================================
# Cluster-wide RBAC for Atlas service accounts
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-prometheus-clusterrole
  labels:
    atlas.io/baseline: v40.1
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-prometheus-clusterrolebinding
  labels:
    atlas.io/baseline: v40.1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-prometheus-clusterrole
subjects:
  - kind: ServiceAccount
    name: atlas-prometheus-sa
    namespace: atlas-observability

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-fluent-bit-clusterrole
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-fluent-bit-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-fluent-bit-clusterrole
subjects:
  - kind: ServiceAccount
    name: atlas-fluent-bit-sa
    namespace: atlas-observability

---
# ============================================================
# External Secrets Operator — SecretStore (AWS Secrets Manager)
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: atlas-aws-secrets-manager
  labels:
    atlas.io/baseline: v40.1
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: atlas-external-secrets-sa
            namespace: atlas-secrets

---
# ExternalSecret for each namespace pulls from AWS SM at deploy time
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atlas-identity-externalsecret
  namespace: atlas-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: atlas-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: atlas-identity-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: atlas/identity/v40.1
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: atlas/identity/v40.1
        property: DB_PASSWORD
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: atlas/identity/v40.1
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: atlas/identity/v40.1
        property: JWT_PUBLIC_KEY
    - secretKey: OAUTH2_CLIENT_ID
      remoteRef:
        key: atlas/identity/v40.1
        property: OAUTH2_CLIENT_ID
    - secretKey: OAUTH2_CLIENT_SECRET
      remoteRef:
        key: atlas/identity/v40.1
        property: OAUTH2_CLIENT_SECRET
    - secretKey: LDAP_BIND_PASSWORD
      remoteRef:
        key: atlas/identity/v40.1
        property: LDAP_BIND_PASSWORD
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: atlas/identity/v40.1
        property: ENCRYPTION_KEY

