---
# ============================================================
# Atlas One v40.1 — ELB Service & Channel Definitions
# Namespace: atlas-elb
# Components: ELB Controller, Channel Manager, Session Broker,
#             Traffic Shaper, Health Orchestrator
# ============================================================

# ---- ELB Controller -------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-elb-controller
  namespace: atlas-elb
  labels:
    app: atlas-elb-controller
    version: v40.1
    tier: infrastructure
    component: elb
    subsystem: controller
  annotations:
    atlas.io/service: "elb-controller"
    atlas.io/owner: "platform-networking-team"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-elb-controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-elb-controller
        version: v40.1
        tier: infrastructure
    spec:
      serviceAccountName: atlas-elb-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - atlas-elb-controller
              topologyKey: kubernetes.io/hostname
      containers:
        - name: elb-controller
          image: registry.atlas.io/atlas-elb-controller:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50070
              protocol: TCP
            - name: http
              containerPort: 8100
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: xds
              containerPort: 18000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-elb-controller"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: GRPC_PORT
              value: "50070"
            - name: HTTP_PORT
              value: "8100"
            - name: METRICS_PORT
              value: "9090"
            - name: XDS_PORT
              value: "18000"
            # Load balancing algorithms
            - name: LB_ALGORITHM_DEFAULT
              value: "LEAST_CONNECTIONS"
            - name: LB_ALGORITHM_TELCO
              value: "WEIGHTED_ROUND_ROBIN"
            - name: LB_ALGORITHM_LTE
              value: "IP_HASH"
            - name: LB_ALGORITHM_FOOD_DEFENSE
              value: "LEAST_CONNECTIONS"
            - name: LB_ALGORITHM_IDENTITY
              value: "ROUND_ROBIN"
            - name: LB_ALGORITHM_PROVENANCE
              value: "RANDOM"
            # Health check
            - name: HEALTH_CHECK_INTERVAL_MS
              value: "5000"
            - name: HEALTH_CHECK_TIMEOUT_MS
              value: "2000"
            - name: UNHEALTHY_THRESHOLD
              value: "3"
            - name: HEALTHY_THRESHOLD
              value: "2"
            # Session persistence
            - name: SESSION_AFFINITY_ENABLED
              value: "true"
            - name: SESSION_AFFINITY_TTL_SECONDS
              value: "3600"
            - name: SESSION_AFFINITY_COOKIE
              value: "ATLAS_SESSION"
            # Circuit breaker
            - name: CIRCUIT_BREAKER_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_ERROR_PERCENT
              value: "50"
            - name: CIRCUIT_BREAKER_WINDOW_SECONDS
              value: "10"
            - name: CIRCUIT_BREAKER_SLEEP_SECONDS
              value: "30"
            # Rate limiting
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: RATE_LIMIT_BACKEND
              value: "redis"
            - name: RATE_LIMIT_DEFAULT_RPS
              value: "10000"
            - name: RATE_LIMIT_BURST_MULTIPLIER
              value: "1.5"
            # xDS/Envoy
            - name: XDS_PROTOCOL
              value: "ADS"
            - name: ENVOY_CONTROL_PLANE_VERSION
              value: "v3"
            # Upstream services
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-elb-config
                  key: REDIS_HOST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-elb-config
                  key: KAFKA_BROKERS
            - name: ETCD_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: atlas-elb-config
                  key: ETCD_ENDPOINTS
            - name: ELB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atlas-elb-secrets
                  key: ELB_ADMIN_TOKEN
            - name: TLS_CERT_ROTATION_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-elb-secrets
                  key: TLS_CERT_ROTATION_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "3000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8100
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: elb-config-vol
              mountPath: /etc/atlas/elb
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-elb-tls
        - name: elb-config-vol
          configMap:
            name: atlas-elb-config
      imagePullSecrets:
        - name: atlas-registry-creds

