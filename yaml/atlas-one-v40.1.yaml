apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-jaeger-collector
  namespace: atlas-observability
  labels:
    app: atlas-jaeger-collector
    version: v40.1
    tier: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-jaeger-collector
  template:
    metadata:
      labels:
        app: atlas-jaeger-collector
        version: v40.1
        tier: observability
    spec:
      serviceAccountName: atlas-prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: jaeger-collector
          image: registry.atlas.io/jaeger-collector:1.60.0-atlas
          imagePullPolicy: IfNotPresent
          args:
            - "--span-storage.type=elasticsearch"
            - "--es.server-urls=http://atlas-elasticsearch.atlas-observability.svc.cluster.local:9200"
            - "--es.index-prefix=atlas-jaeger"
            - "--es.num-shards=3"
            - "--es.num-replicas=1"
            - "--log-level=info"
            - "--collector.queue-size=100000"
            - "--collector.num-workers=50"
          ports:
            - name: grpc
              containerPort: 14250
              protocol: TCP
            - name: http
              containerPort: 14268
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: atlas-registry-creds

