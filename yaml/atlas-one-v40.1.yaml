apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-gateway-svc
  namespace: atlas-gateway
  labels:
    app: atlas-gateway-svc
    version: v40.1
    tier: edge
    component: gateway
    subsystem: core
  annotations:
    atlas.io/service: "gateway"
    atlas.io/owner: "platform-engineering"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-gateway-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-gateway-svc
        version: v40.1
        tier: edge
    spec:
      serviceAccountName: atlas-gateway-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - atlas-gateway-svc
              topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - atlas-elb-controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway-svc
          image: registry.atlas.io/atlas-gateway-svc:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50080
              protocol: TCP
            - name: http
              containerPort: 8200
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-gateway-svc"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: GRPC_PORT
              value: "50080"
            - name: HTTP_PORT
              value: "8200"
            - name: HTTPS_PORT
              value: "8443"
            - name: METRICS_PORT
              value: "9090"
            # TLS
            - name: TLS_MIN_VERSION
              value: "TLSv1.3"
            - name: TLS_CIPHER_SUITES
              value: "TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256"
            - name: MTLS_ENABLED
              value: "true"
            - name: MTLS_CLIENT_CERT_REQUIRED
              value: "false"
            # Auth
            - name: AUTH_BACKEND
              value: "jwt"
            - name: JWT_ISSUER
              value: "https://identity.atlas.io"
            - name: JWT_AUDIENCE
              value: "atlas-platform"
            - name: JWT_VERIFY_EXPIRY
              value: "true"
            - name: API_KEY_ENABLED
              value: "true"
            - name: API_KEY_HEADER
              value: "X-Atlas-API-Key"
            - name: OAUTH2_ENABLED
              value: "true"
            # CORS
            - name: CORS_ENABLED
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://console.atlas.io,https://api.atlas.io,https://portal.atlas.io"
            - name: CORS_ALLOWED_METHODS
              value: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            - name: CORS_ALLOWED_HEADERS
              value: "Authorization,Content-Type,X-Atlas-API-Key,X-Request-ID,X-Correlation-ID"
            - name: CORS_MAX_AGE_SECONDS
              value: "3600"
            # Request handling
            - name: REQUEST_TIMEOUT_MS
              value: "30000"
            - name: BODY_SIZE_LIMIT_BYTES
              value: "52428800"
            - name: COMPRESSION_ENABLED
              value: "true"
            - name: COMPRESSION_ALGORITHMS
              value: "gzip,br,deflate"
            # Upstream routing
            - name: UPSTREAM_IDENTITY
              value: "http://atlas-identity-svc.atlas-identity.svc.cluster.local:8080"
            - name: UPSTREAM_TELCO
              value: "http://atlas-telco-svc.atlas-telco.svc.cluster.local:8081"
            - name: UPSTREAM_LTE
              value: "http://atlas-lte-svc.atlas-lte.svc.cluster.local:8082"
            - name: UPSTREAM_ROUTING
              value: "http://atlas-routing-svc.atlas-routing.svc.cluster.local:8083"
            - name: UPSTREAM_PROVENANCE
              value: "http://atlas-provenance-svc.atlas-provenance.svc.cluster.local:8084"
            - name: UPSTREAM_FOOD_DEFENSE
              value: "http://atlas-fd-threat-detection.atlas-food-defense.svc.cluster.local:8090"
            - name: UPSTREAM_ADAPTERS
              value: "http://atlas-adapter-orchestrator.atlas-adapters.svc.cluster.local:8300"
            # Service mesh
            - name: SERVICE_MESH
              value: "istio"
            - name: TRACING_ENABLED
              value: "true"
            - name: TRACING_BACKEND
              value: "jaeger"
            - name: TRACING_SAMPLE_RATE
              value: "0.1"
            - name: JAEGER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: atlas-gateway-config
                  key: JAEGER_ENDPOINT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: atlas-gateway-config
                  key: REDIS_HOST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-gateway-config
                  key: KAFKA_BROKERS
            - name: GATEWAY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-gateway-secrets
                  key: GATEWAY_SIGNING_KEY
            - name: API_KEY_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-gateway-secrets
                  key: API_KEY_MASTER_SECRET
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-gateway-secrets
                  key: OAUTH2_CLIENT_SECRET
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: 8200
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: gateway-config-vol
              mountPath: /etc/atlas/gateway
              readOnly: true
            - name: route-rules-vol
              mountPath: /etc/atlas/gateway/routes
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
        - name: grpc-transcoder
          image: registry.atlas.io/atlas-grpc-transcoder:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: transcoder
              containerPort: 8201
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-grpc-transcoder"
            - name: TRANSCODER_PORT
              value: "8201"
            - name: PROTO_DESCRIPTOR_PATH
              value: "/etc/atlas/gateway/proto-descriptors"
            - name: JSON_CAMEL_CASE
              value: "true"
            - name: UNKNOWN_FIELDS_IGNORE
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8201
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: gateway-config-vol
              mountPath: /etc/atlas/gateway
              readOnly: true
            - name: proto-descriptors-vol
              mountPath: /etc/atlas/gateway/proto-descriptors
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-gateway-tls
        - name: gateway-config-vol
          configMap:
            name: atlas-gateway-config
        - name: route-rules-vol
          configMap:
            name: atlas-gateway-route-rules
        - name: proto-descriptors-vol
          configMap:
            name: atlas-gateway-proto-descriptors
      imagePullSecrets:
        - name: atlas-registry-creds

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-gateway-svc
  namespace: atlas-gateway
  labels:
    app: atlas-gateway-svc
    version: v40.1
spec:
  type: ClusterIP
  selector:
    app: atlas-gateway-svc
  ports:
    - name: grpc
      port: 50080
      targetPort: 50080
    - name: http
      port: 8200
      targetPort: 8200
    - name: https
      port: 8443
      targetPort: 8443
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: transcoder
      port: 8201
      targetPort: 8201

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-gateway-public
  namespace: atlas-gateway
  labels:
    app: atlas-gateway-svc
    version: v40.1
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/atlas-gateway-cert"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "ssl"
spec:
  type: LoadBalancer
  selector:
    app: atlas-gateway-svc
  ports:
    - name: https
      port: 443
      targetPort: 8443
    - name: http-redirect
      port: 80
      targetPort: 8200

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-gateway-config
  namespace: atlas-gateway
data:
  REDIS_HOST: "redis-master.atlas-gateway.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-0.atlas-observability.svc.cluster.local:9092"
  KAFKA_GATEWAY_EVENTS_TOPIC: "atlas.gateway.events"
  KAFKA_ACCESS_LOG_TOPIC: "atlas.gateway.access-log"
  JAEGER_ENDPOINT: "http://jaeger-collector.atlas-observability.svc.cluster.local:14268/api/traces"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.atlas-observability.svc.cluster.local:4318"
  RATE_LIMIT_GLOBAL_RPS: "50000"
  RATE_LIMIT_PER_IP_RPS: "500"
  RATE_LIMIT_PER_USER_RPS: "1000"
  RATE_LIMIT_PER_API_KEY_RPS: "5000"
  WEBSOCKET_ENABLED: "true"
  WEBSOCKET_PING_INTERVAL_SECONDS: "30"
  WEBSOCKET_MAX_MESSAGE_SIZE_BYTES: "1048576"
  GRAPHQL_ENABLED: "true"
  GRAPHQL_INTROSPECTION_ENABLED: "false"
  GRAPHQL_MAX_DEPTH: "10"
  GRAPHQL_MAX_COMPLEXITY: "1000"
  HTTP2_ENABLED: "true"
  GRPC_WEB_ENABLED: "true"
  ACCESS_LOG_ENABLED: "true"
  ACCESS_LOG_INCLUDE_BODY: "false"
  WAF_ENABLED: "true"
  WAF_RULESET: "owasp-crs-v4"
  WAF_MODE: "enforce"
  IP_ALLOWLIST_ENABLED: "false"
  IP_BLOCKLIST_ENABLED: "true"
  IP_BLOCKLIST_BACKEND: "redis"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-gateway-route-rules
  namespace: atlas-gateway
data:
  routes.yaml: |
    routes:
      - id: identity-api
        path_prefix: /api/v1/identity
        upstream: atlas-identity-svc.atlas-identity.svc.cluster.local:8080
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: standard
        timeout_ms: 5000
        retry:
          count: 2
          status_codes: [502, 503, 504]
      - id: telco-api
        path_prefix: /api/v1/telco
        upstream: atlas-telco-svc.atlas-telco.svc.cluster.local:8081
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: high
        timeout_ms: 10000
        retry:
          count: 1
          status_codes: [503, 504]
      - id: lte-api
        path_prefix: /api/v1/lte
        upstream: atlas-lte-svc.atlas-lte.svc.cluster.local:8082
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: high
        timeout_ms: 10000
        retry:
          count: 1
          status_codes: [503, 504]
      - id: routing-api
        path_prefix: /api/v1/routing
        upstream: atlas-routing-svc.atlas-routing.svc.cluster.local:8083
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: standard
        timeout_ms: 5000
        retry:
          count: 2
          status_codes: [502, 503, 504]
      - id: provenance-api
        path_prefix: /api/v1/provenance
        upstream: atlas-provenance-svc.atlas-provenance.svc.cluster.local:8084
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: standard
        timeout_ms: 8000
        retry:
          count: 2
          status_codes: [503, 504]
      - id: food-defense-api
        path_prefix: /api/v1/food-defense
        upstream: atlas-fd-threat-detection.atlas-food-defense.svc.cluster.local:8090
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: critical
        timeout_ms: 3000
        retry:
          count: 3
          status_codes: [502, 503, 504]
      - id: adapters-api
        path_prefix: /api/v1/adapters
        upstream: atlas-adapter-orchestrator.atlas-adapters.svc.cluster.local:8300
        strip_prefix: /api/v1
        auth_required: true
        rate_limit_profile: standard
        timeout_ms: 15000
        retry:
          count: 1
          status_codes: [503, 504]
      - id: health-public
        path_prefix: /health
        upstream: localhost:8200
        auth_required: false
        rate_limit_profile: none
        timeout_ms: 1000
        retry:
          count: 0
          status_codes: []

---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-gateway-secrets
  namespace: atlas-gateway
  annotations:
    atlas.io/secret-manager: "aws-secrets-manager"
    atlas.io/secret-arn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:atlas/gateway/v40.1"
type: Opaque
stringData:
  GATEWAY_SIGNING_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  API_KEY_MASTER_SECRET: "PLACEHOLDER_INJECT_AT_DEPLOY"
  OAUTH2_CLIENT_SECRET: "PLACEHOLDER_INJECT_AT_DEPLOY"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-gateway-hpa
  namespace: atlas-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-gateway-svc
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Pods
      pods:
        metric:
          name: atlas_gateway_active_requests
        target:
          type: AverageValue
          averageValue: "2500"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-gateway-pdb
  namespace: atlas-gateway
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: atlas-gateway-svc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-gateway-sa
  namespace: atlas-gateway
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/atlas-gateway-svc-role"

---
# Istio VirtualService for gateway
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: atlas-gateway-vs
  namespace: atlas-gateway
spec:
  hosts:
    - api.atlas.io
    - atlas-gateway-svc
  gateways:
    - atlas-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/food-defense
      route:
        - destination:
            host: atlas-gateway-svc
            port:
              number: 8443
      timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx,gateway-error,reset
    - match:
        - uri:
            prefix: /api/v1
      route:
        - destination:
            host: atlas-gateway-svc
            port:
              number: 8443
      timeout: 30s
      retries:
        attempts: 2
        perTryTimeout: 10s
        retryOn: 5xx,gateway-error,reset

---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: atlas-gateway
  namespace: atlas-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: atlas-gateway-tls
      hosts:
        - api.atlas.io
        - console.atlas.io


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION: 09_vertical_adapters.yaml
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
---
# ============================================================
# Atlas One v40.1 — Vertical Adapters
# Namespace: atlas-adapters
# Components: Adapter Orchestrator, ERP Adapter, SCM Adapter,
#             SCADA/IoT Adapter, Regulatory Adapter,
#             Healthcare Adapter, Financial Adapter,
#             Legacy Telco Adapter, Cloud Federation Adapter
# ============================================================

# ---- Adapter Orchestrator -------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-adapter-orchestrator
  namespace: atlas-adapters
  labels:
    app: atlas-adapter-orchestrator
    version: v40.1
    tier: integration
    component: adapters
    subsystem: orchestrator
  annotations:
    atlas.io/service: "adapter-orchestrator"
    atlas.io/owner: "integrations-team"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atlas-adapter-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atlas-adapter-orchestrator
        version: v40.1
        tier: integration
    spec:
      serviceAccountName: atlas-adapters-sa
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter-orchestrator
          image: registry.atlas.io/atlas-adapter-orchestrator:v40.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50090
              protocol: TCP
            - name: http
              containerPort: 8300
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "atlas-adapter-orchestrator"
            - name: SERVICE_VERSION
              value: "v40.1"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: ADAPTER_REGISTRY_BACKEND
              value: "etcd"
            - name: ADAPTER_DISCOVERY_MODE
              value: "dynamic"
            - name: ADAPTER_HEALTH_CHECK_INTERVAL_MS
              value: "10000"
            - name: ADAPTER_TIMEOUT_DEFAULT_MS
              value: "30000"
            - name: ADAPTER_RETRY_MAX
              value: "3"
            - name: ADAPTER_CIRCUIT_BREAKER_ENABLED
              value: "true"
            - name: MESSAGE_BUS
              value: "kafka"
            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-adapters-config
                  key: SCHEMA_REGISTRY_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: atlas-adapters-config
                  key: KAFKA_BROKERS
            - name: ETCD_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: atlas-adapters-config
                  key: ETCD_ENDPOINTS
            - name: ORCHESTRATOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-adapters-secrets
                  key: ORCHESTRATOR_SIGNING_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8300
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8300
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: adapters-config-vol
              mountPath: /etc/atlas/adapters
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: atlas-adapters-tls
        - name: adapters-config-vol
          configMap:
            name: atlas-adapters-config
      imagePullSecrets:
        - name: atlas-registry-creds

---
# ---- ERP Adapter (SAP/Oracle/MS Dynamics) ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-adapter-erp
  namespace: atlas-adapters
  labels:
    app: atlas-adapter-erp
    version: v40.1
    tier: integration
    component: adapters
    subsystem: erp
  annotations:
    atlas.io/service: "adapter-erp"
    atlas.io/supported-systems: "SAP-S4HANA,Oracle-EBS,MS-Dynamics-365"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
