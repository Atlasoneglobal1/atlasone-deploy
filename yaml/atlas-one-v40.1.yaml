                configMapKeyRef:
                  name: atlas-adapters-config
                  key: ORACLE_JDBC_URL
            - name: SAP_RFC_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-adapters-secrets
                  key: SAP_RFC_USER
            - name: SAP_RFC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-adapters-secrets
                  key: SAP_RFC_PASSWORD
            - name: ORACLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-adapters-secrets
                  key: ORACLE_DB_PASSWORD
            - name: MS_DYNAMICS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-adapters-secrets
