            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            # QoS
            - name: QOS_ENABLED
              value: "true"
            - name: QOS_CLASSES
              value: "CRITICAL,HIGH,MEDIUM,LOW,BACKGROUND"
