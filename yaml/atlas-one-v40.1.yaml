metadata:
  name: atlas-lte-secrets
  namespace: atlas-lte
  annotations:
    atlas.io/secret-manager: "aws-secrets-manager"
    atlas.io/secret-arn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:atlas/lte/v40.1"
type: Opaque
stringData:
  LTE_SECURITY_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  MME_SHARED_KEY: "PLACEHOLDER_INJECT_AT_DEPLOY"
  HSS_DB_PASSWORD: "PLACEHOLDER_INJECT_AT_DEPLOY"
