name: Deploy POS Fallback

# Push to main  -> build, push to ACR, deploy to staging.
# Manual run    -> choose staging or prod (Actions tab > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "services/pos-fallback/**"
      - ".github/workflows/pos-fallback-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, prod]
        default: staging

# OIDC: GitHub signs in to Azure with a short-lived token. No passwords are stored.
permissions:
  id-token: write
  contents: read

concurrency:
  group: pos-fallback-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: atlasoneacr
  IMAGE: pos-fallback
  RESOURCE_GROUP: atlasone-core
  APP_NAME: atlasone-pos-fallback-${{ inputs.environment || 'staging' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image in ACR
        run: |
          az acr build \
            --registry "$REGISTRY" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            "services/$IMAGE"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}"

      - name: Health check
        run: |
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN/health"
          for i in $(seq 1 20); do
            if curl -fsS "https://$FQDN/health"; then echo; echo "Healthy"; exit 0; fi
            sleep 15
          done
          echo "Health check failed"; exit 1
